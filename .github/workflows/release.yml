name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        default: rust
        type: choice
        options:
          - rust
          - python
          - csharp
      version:
        description: "Package version to publish, for example 0.1.0"
        required: true
        type: string
  push:
    tags:
      - "rust-sapient-rs-v*"
      - "python-sapient-py-v*"
      - "csharp-sapient-bindings-v*"

jobs:
  publish-rust:
    name: Publish Rust crate
    if: startsWith(github.ref, 'refs/tags/rust-sapient-rs-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'rust')
    runs-on: ubuntu-latest
    concurrency:
      group: release-rust-${{ github.ref_name || github.run_id }}
      cancel-in-progress: false
    environment:
      name: crates-io
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.0"

      - name: Verify generated bindings are up to date
        run: |
          ./scripts/regenerate-rust-bindings.sh
          git diff --exit-code

      - name: Verify Rust release version
        shell: bash
        run: |
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/sapient-rs/Cargo.toml | head -n1)"
          if [ -z "$manifest_version" ]; then
            echo "Failed to read Rust package version from Cargo.toml" >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            expected_version="${GITHUB_REF_NAME#rust-sapient-rs-v}"
          else
            expected_version="${{ inputs.version }}"
          fi

          if [ "$manifest_version" != "$expected_version" ]; then
            echo "Rust package version mismatch: manifest=$manifest_version expected=$expected_version" >&2
            exit 1
          fi

      - name: Publish sapient-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p sapient-rs

  publish-python:
    name: Publish Python package
    if: startsWith(github.ref, 'refs/tags/python-sapient-py-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'python')
    runs-on: ubuntu-latest
    concurrency:
      group: release-python-${{ github.ref_name || github.run_id }}
      cancel-in-progress: false
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.0"

      - name: Install Python packaging tools
        run: python -m pip install --upgrade pip setuptools wheel build twine protobuf

      - name: Verify generated bindings are up to date
        run: |
          ./scripts/regenerate-python-bindings.sh
          git diff --exit-code

      - name: Verify Python release version
        shell: bash
        run: |
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' python/sapient-py/pyproject.toml | head -n1)"
          if [ -z "$manifest_version" ]; then
            echo "Failed to read Python package version from pyproject.toml" >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            expected_version="${GITHUB_REF_NAME#python-sapient-py-v}"
          else
            expected_version="${{ inputs.version }}"
          fi

          if [ "$manifest_version" != "$expected_version" ]; then
            echo "Python package version mismatch: manifest=$manifest_version expected=$expected_version" >&2
            exit 1
          fi

      - name: Build Python package
        run: ./scripts/build-python-package.sh

      - name: Check Python package metadata
        run: ./scripts/check-python-package.sh

      - name: Publish sapient-py
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/sapient-py/dist/

  publish-csharp:
    name: Publish C# package
    if: startsWith(github.ref, 'refs/tags/csharp-sapient-bindings-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'csharp')
    runs-on: ubuntu-latest
    concurrency:
      group: release-csharp-${{ github.ref_name || github.run_id }}
      cancel-in-progress: false
    environment:
      name: Nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.0"

      - name: Verify generated bindings are up to date
        run: |
          ./scripts/regenerate-csharp-bindings.sh
          git diff --exit-code

      - name: Verify C# release version
        shell: bash
        run: |
          manifest_version="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' csharp/sapient-csharp/Sapient.Bindings.csproj | head -n1)"
          if [ -z "$manifest_version" ]; then
            echo "Failed to read C# package version from Sapient.Bindings.csproj" >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            expected_version="${GITHUB_REF_NAME#csharp-sapient-bindings-v}"
          else
            expected_version="${{ inputs.version }}"
          fi

          if [ "$manifest_version" != "$expected_version" ]; then
            echo "C# package version mismatch: manifest=$manifest_version expected=$expected_version" >&2
            exit 1
          fi

      - name: Build C# package
        run: dotnet build csharp/sapient-csharp/Sapient.Bindings.csproj --configuration Release

      - name: Run C# tests
        run: dotnet test csharp/sapient-csharp.Tests/Sapient.Bindings.Tests.csproj --configuration Release

      - name: Pack C# package
        run: dotnet pack csharp/sapient-csharp/Sapient.Bindings.csproj --configuration Release --no-build

      - name: Publish Sapient.Bindings
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push Sapient.Bindings
        run: |
          dotnet nuget push "csharp/sapient-csharp/bin/Release/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
