name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.0"

      - name: Verify generated bindings are up to date
        run: |
          ./scripts/regenerate-rust-bindings.sh
          git diff --exit-code

      - name: Run Rust tests
        run: cargo test

      - name: Run Rust tests with all schema features
        run: cargo test -p sapient-rs --features v1_0,v2_0

      - name: Check Rust package
        run: cargo package -p sapient-rs --allow-dirty --offline --no-verify

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.0"

      - name: Install Python packaging tools
        run: python -m pip install --upgrade pip setuptools wheel build twine protobuf

      - name: Verify generated bindings are up to date
        run: |
          ./scripts/regenerate-python-bindings.sh
          git diff --exit-code

      - name: Compile Python sources
        run: python -m compileall python/sapient-py/src

      - name: Build Python package
        run: ./scripts/build-python-package.sh

      - name: Check Python package metadata
        run: ./scripts/check-python-package.sh

  csharp:
    name: C#
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.0"

      - name: Verify generated bindings are up to date
        run: |
          ./scripts/regenerate-csharp-bindings.sh
          git diff --exit-code

      - name: Build C# package
        run: dotnet build csharp/sapient-csharp/Sapient.Bindings.csproj --configuration Release

      - name: Run C# tests
        run: dotnet test csharp/sapient-csharp.Tests/Sapient.Bindings.Tests.csproj --configuration Release

      - name: Pack C# package
        run: dotnet pack csharp/sapient-csharp/Sapient.Bindings.csproj --configuration Release --no-build
